name: Build Gamino APK

on:
  push:
    branches:
      - main
    paths:
      - "*.zip"
      - ".github/workflows/build-apk-gamino-auto.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gamino-android-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_DIR: gamino_build_src
  OUTPUT_DIR: gamino_build_output

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find latest ZIP and extract Gamino Flutter source
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -printf '%T@ %p\n' \
            | sort -nr \
            | cut -d' ' -f2- \
            | head -n 1)"

          if [[ -z "${ZIP_FILE:-}" || ! -f "$ZIP_FILE" ]]; then
            echo "::error::No ZIP file was found in repository root."
            exit 1
          fi

          echo "Using ZIP: $(basename "$ZIP_FILE")"

          WORK_DIR="$RUNNER_TEMP/gamino_extract"

          rm -rf "$WORK_DIR"
          rm -rf "$GITHUB_WORKSPACE/$SOURCE_DIR"

          mkdir -p "$WORK_DIR/root"
          mkdir -p "$GITHUB_WORKSPACE/$SOURCE_DIR"

          unzip -q "$ZIP_FILE" -d "$WORK_DIR/root"

          # پشتیبانی از ZIP مستقیم Flutter و ZIP کامل Handoff
          # که ممکن است داخل خودش ZIP دیگری داشته باشد.
          for pass in 1 2 3; do

            mapfile -t NESTED_ZIPS < <(
              find "$WORK_DIR" -type f -iname '*.zip' -print
            )

            [[ ${#NESTED_ZIPS[@]} -eq 0 ]] && break

            extracted_any=0

            for nested in "${NESTED_ZIPS[@]}"; do

              marker="${nested}.extracted"

              [[ -f "$marker" ]] && continue

              target="${nested%.*}_unpacked"

              mkdir -p "$target"

              if unzip -q "$nested" -d "$target"; then
                touch "$marker"
                extracted_any=1
              fi

            done

            [[ "$extracted_any" -eq 0 ]] && break

          done

          PUBSPEC="$(
            find "$WORK_DIR" -type f -name pubspec.yaml -print \
            | while read -r file; do

                dir="$(dirname "$file")"

                if [[ \
                  -f "$dir/scripts/prepare_android.py" \
                  && -d "$dir/build_support" \
                ]]; then

                  echo "$file"
                  break

                fi

              done
          )"

          if [[ -z "${PUBSPEC:-}" || ! -f "$PUBSPEC" ]]; then

            echo "::error::Gamino Flutter source was not found inside the ZIP."

            find "$WORK_DIR" -maxdepth 5 -type f \
              | sort \
              | head -n 300 || true

            exit 1

          fi

          FOUND_SOURCE="$(dirname "$PUBSPEC")"

          echo "Flutter source found:"
          echo "$FOUND_SOURCE"

          cp -a "$FOUND_SOURCE/." "$GITHUB_WORKSPACE/$SOURCE_DIR/"

          if [[ ! -f "$GITHUB_WORKSPACE/$SOURCE_DIR/build_support/flutter-version.txt" ]]; then
            echo "::error::flutter-version.txt is missing."
            exit 1
          fi

          if [[ ! -f "$GITHUB_WORKSPACE/$SOURCE_DIR/build_support/gradle-version.txt" ]]; then
            echo "::error::gradle-version.txt is missing."
            exit 1
          fi

          FLUTTER_VERSION="$(
            tr -d '[:space:]' \
            < "$GITHUB_WORKSPACE/$SOURCE_DIR/build_support/flutter-version.txt"
          )"

          GRADLE_VERSION="$(
            tr -d '[:space:]' \
            < "$GITHUB_WORKSPACE/$SOURCE_DIR/build_support/gradle-version.txt"
          )"

          if [[ -z "$FLUTTER_VERSION" ]]; then
            echo "::error::Flutter version is empty."
            exit 1
          fi

          if [[ -z "$GRADLE_VERSION" ]]; then
            echo "::error::Gradle version is empty."
            exit 1
          fi

          echo "flutter_version=$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"
          echo "gradle_version=$GRADLE_VERSION" >> "$GITHUB_OUTPUT"
          echo "zip_name=$(basename "$ZIP_FILE")" >> "$GITHUB_OUTPUT"

          echo "-----------------------------------"
          echo "Gamino Build Configuration"
          echo "-----------------------------------"
          echo "Flutter : $FLUTTER_VERSION"
          echo "Gradle  : $GRADLE_VERSION"
          echo "ZIP     : $(basename "$ZIP_FILE")"
          echo "-----------------------------------"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "${{ steps.source.outputs.flutter_version }}"
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -Eeuo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Cache Gradle and Pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache

          key: >
            gamino-${{ runner.os }}-
            ${{ steps.source.outputs.flutter_version }}-
            ${{ hashFiles(
              'gamino_build_src/pubspec.yaml',
              'gamino_build_src/android/**/*.gradle',
              'gamino_build_src/android/**/*.gradle.kts',
              'gamino_build_src/android/gradle.properties'
            ) }}

          restore-keys: |
            gamino-${{ runner.os }}-${{ steps.source.outputs.flutter_version }}-
            gamino-${{ runner.os }}-

      - name: Flutter diagnostics
        working-directory: gamino_build_src
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "===================================="
          echo "Flutter"
          echo "===================================="

          flutter --version

          echo "===================================="
          echo "Dart"
          echo "===================================="

          dart --version

          echo "===================================="
          echo "Java"
          echo "===================================="

          java -version

          echo "===================================="
          echo "Flutter Doctor"
          echo "===================================="

          flutter doctor -v

      - name: Prepare Android project
        working-directory: gamino_build_src
        shell: bash
        run: |
          set -Eeuo pipefail

          GRADLE_VERSION="${{ steps.source.outputs.gradle_version }}"

          SCAFFOLD_DIR="$RUNNER_TEMP/gamino_android_wrapper"

          rm -rf "$SCAFFOLD_DIR"

          echo "Creating temporary Android Flutter wrapper..."

          flutter create \
            --platforms=android \
            --org ir.miplus \
            --project-name gamino \
            --no-pub \
            "$SCAFFOLD_DIR"

          mkdir -p android/gradle/wrapper
          mkdir -p android/app

          echo "Copying Gradle wrapper..."

          cp \
            "$SCAFFOLD_DIR/android/gradle/wrapper/gradle-wrapper.jar" \
            android/gradle/wrapper/gradle-wrapper.jar

          cp \
            "$SCAFFOLD_DIR/android/gradlew" \
            android/gradlew

          cp \
            "$SCAFFOLD_DIR/android/gradlew.bat" \
            android/gradlew.bat

          chmod +x android/gradlew

          echo "Configuring Gradle $GRADLE_VERSION..."

          cat > android/gradle/wrapper/gradle-wrapper.properties <<EOF
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          echo "Checking release signing files..."

          if [[ ! -f build_support/gamino-release-key.jks ]]; then
            echo "::error::build_support/gamino-release-key.jks is missing."
            exit 1
          fi

          if [[ ! -f build_support/key.properties ]]; then
            echo "::error::build_support/key.properties is missing."
            exit 1
          fi

          cp \
            build_support/gamino-release-key.jks \
            android/app/gamino-release-key.jks

          cp \
            build_support/key.properties \
            android/key.properties

          echo "Running Gamino Android preparation script..."

          python3 scripts/prepare_android.py

          rm -rf "$SCAFFOLD_DIR"

          echo "Verifying Kotlin..."

          grep -q 'version "2.1.10"' \
            android/settings.gradle || {
              echo "::error::Kotlin 2.1.10 verification failed."
              exit 1
            }

          echo "Verifying compileSdk..."

          grep -Eq \
            'compileSdk[[:space:]]*=[[:space:]]*36' \
            android/app/build.gradle || {
              echo "::error::compileSdk 36 verification failed."
              exit 1
            }

          echo "Verifying targetSdk..."

          grep -Eq \
            'targetSdk[[:space:]]*=' \
            android/app/build.gradle || {
              echo "::error::targetSdk configuration was not found."
              exit 1
            }

          echo "Gradle wrapper:"

          ./android/gradlew --version

      - name: Get Flutter packages
        working-directory: gamino_build_src
        shell: bash
        run: |
          set -Eeuo pipefail

          flutter pub get

      - name: Static analysis
        working-directory: gamino_build_src
        shell: bash
        run: |
          set -o pipefail

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings \
            2>&1 \
            | tee "$GITHUB_WORKSPACE/flutter-analyze.log"

      - name: Build release APK
        working-directory: gamino_build_src
        shell: bash
        run: |
          set -o pipefail

          flutter build apk \
            --release \
            --no-shrink \
            --android-skip-build-dependency-validation \
            2>&1 \
            | tee "$GITHUB_WORKSPACE/flutter-build.log"

      - name: Verify and rename APK
        id: apk
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="$GITHUB_WORKSPACE/$SOURCE_DIR/build/app/outputs/flutter-apk/app-release.apk"

          PUBSPEC="$GITHUB_WORKSPACE/$SOURCE_DIR/pubspec.yaml"

          if [[ ! -s "$APK" ]]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          APP_NAME="$(
            awk -F': *' \
              '/^name:/ {print $2; exit}' \
              "$PUBSPEC" \
            | tr -d '\r' \
            | xargs
          )"

          APP_VERSION="$(
            awk -F': *' \
              '/^version:/ {print $2; exit}' \
              "$PUBSPEC" \
            | tr -d '\r' \
            | xargs
          )"

          if [[ -z "$APP_NAME" ]]; then
            APP_NAME="gamino"
          fi

          if [[ -z "$APP_VERSION" ]]; then
            APP_VERSION="unknown"
          fi

          SAFE_VERSION="${APP_VERSION/+/-}"

          FINAL_NAME="${APP_NAME}-${SAFE_VERSION}.apk"

          rm -rf "$GITHUB_WORKSPACE/$OUTPUT_DIR"

          mkdir -p "$GITHUB_WORKSPACE/$OUTPUT_DIR"

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/$OUTPUT_DIR/$FINAL_NAME"

          SHA256="$(
            sha256sum \
              "$GITHUB_WORKSPACE/$OUTPUT_DIR/$FINAL_NAME" \
            | awk '{print $1}'
          )"

          SIZE="$(
            du -h \
              "$GITHUB_WORKSPACE/$OUTPUT_DIR/$FINAL_NAME" \
            | awk '{print $1}'
          )"

          echo \
            "$SHA256  $FINAL_NAME" \
            > "$GITHUB_WORKSPACE/$OUTPUT_DIR/SHA256SUMS.txt"

          echo "apk_name=$FINAL_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$SHA256" >> "$GITHUB_OUTPUT"

          echo "===================================="
          echo "BUILD SUCCESS"
          echo "===================================="
          echo "APK:"
          echo "$FINAL_NAME"
          echo
          echo "Size:"
          echo "$SIZE"
          echo
          echo "SHA256:"
          echo "$SHA256"
          echo "===================================="

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Gamino-${{ github.run_number }}-${{ steps.apk.outputs.apk_name }}

          path: |
            gamino_build_output/*.apk
            gamino_build_output/SHA256SUMS.txt

          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Gamino-build-diagnostics-${{ github.run_number }}-attempt-${{ github.run_attempt }}

          path: |
            flutter-analyze.log
            flutter-build.log
            gamino_build_src/pubspec.yaml
            gamino_build_src/pubspec.lock
            gamino_build_src/android/build.gradle
            gamino_build_src/android/settings.gradle
            gamino_build_src/android/gradle.properties
            gamino_build_src/android/app/build.gradle
            gamino_build_src/android/gradle/wrapper/gradle-wrapper.properties

          if-no-files-found: ignore
          retention-days: 14

      - name: Build summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Gamino Android Build ✅"
            echo ""
            echo "- Source ZIP: \`${{ steps.source.outputs.zip_name }}\`"
            echo "- Flutter: \`${{ steps.source.outputs.flutter_version }}\`"
            echo "- Gradle: \`${{ steps.source.outputs.gradle_version }}\`"
            echo "- APK: \`${{ steps.apk.outputs.apk_name }}\`"
            echo "- Size: \`${{ steps.apk.outputs.apk_size }}\`"
            echo "- SHA256: \`${{ steps.apk.outputs.apk_sha256 }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
