          for zip_path in candidates:
              try:
                  with zipfile.ZipFile(zip_path) as zf:
                      pubspecs = [
                          n for n in zf.namelist()
                          if n == "pubspec.yaml" or n.endswith("/pubspec.yaml")
                      ]

                      if not pubspecs:
                          continue

                      pubspec = min(
                          pubspecs,
                          key=lambda n: (n.count("/"), len(n))
                      )

